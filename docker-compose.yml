version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus
      - POSTGRES_DB=nexus_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexus-net

  redis:
    image: redis:alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    networks:
      - nexus-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nexus-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nexus_db
      - SPRING_DATASOURCE_USERNAME=nexus
      - SPRING_DATASOURCE_PASSWORD=nexus
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - NEXUS_ENGINE_PATH=/app/nexus_core
    depends_on:
      - postgres
      - redis
    networks:
      - nexus-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - nexus-net

networks:
  nexus-net:
    driver: bridge

volumes:
  postgres_data:
